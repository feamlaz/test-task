services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-resume}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-resume}"
      POSTGRES_DB: "${POSTGRES_DB:-resume}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "${API_PORT:-3000}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD:-resume}@db:5432/${POSTGRES_DB:-resume}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD:-resume}@db:5432/${POSTGRES_DB:-resume}?schema=public"
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
